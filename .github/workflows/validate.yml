name: Validate news and build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-news.txt
      - run: npm ci
      - run: python -m pip install -r requirements-news.txt
      - name: Verify required tokenizer and dictionaries without fetching articles
        run: |
          node --input-type=module -e 'import { tokenizeArticle } from "./scripts/news_tokenizer.mjs"; await tokenizeArticle({ title: "", body: "" });'
      - name: Check publication entry points without fetching or publishing
        run: |
          node --check scripts/publish_news.mjs
          bash -n scripts/update_news_pr.sh
          bash -n scripts/bootstrap_news_rejections.sh
          npm run news:publish -- --help
      - run: npm test
      - run: npm run data:validate
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
