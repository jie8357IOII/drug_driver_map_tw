name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      incidents_sha: ${{ steps.data.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify news and published data
        run: |
          npm test
          npm run data:validate

      - name: Identify the data being published
        id: data
        run: echo "sha=$(sha256sum public/data/incidents.json | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: "true"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published incidents
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ needs.build.outputs.incidents_sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 20 \
              "${PAGE_URL%/}/data/incidents.json?run=${GITHUB_RUN_ID}&attempt=$attempt" \
              -o "$RUNNER_TEMP/published-incidents.json"; then
              actual=$(sha256sum "$RUNNER_TEMP/published-incidents.json" | cut -d ' ' -f1)
              if [ "$actual" = "$EXPECTED_SHA" ]; then
                echo 'Published incidents match this build.' >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'Pages did not return the expected incident data.' >&2
          exit 1
