name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      allow_replay:
        description: "Explicitly permit the latest news-data snapshot if it is replay data"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      ALLOW_REPLAY: ${{ inputs.allow_replay == true && '--allow-replay' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-news.txt
      - name: Install dependencies
        run: |
          npm ci
          python -m pip install -r requirements-news.txt
          node --input-type=module -e 'import { tokenizeArticle } from "./scripts/news_tokenizer.mjs"; await tokenizeArticle({ title: "", body: "" });'
      - name: Restore the latest durable news, never main's stale data
        id: restore
        run: node scripts/publish_news.mjs --restore "$RUNNER_TEMP/news-latest"
      - name: Validate and prepare current data
        env:
          NEWS_DATA_SHA: ${{ steps.restore.outputs.news_data_sha }}
          HAS_SNAPSHOT: ${{ steps.restore.outputs.has_snapshot }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$HAS_SNAPSHOT" != true ]]; then
            echo 'news-data is not initialized. Run Update and publish daily news once, then rerun this deployment.' >&2
            exit 1
          fi
          args=()
          if [[ -n "$ALLOW_REPLAY" ]]; then args+=("$ALLOW_REPLAY"); fi
          node scripts/publish_news.mjs --snapshot "$RUNNER_TEMP/news-latest" --prepare "${args[@]}"
          npm test
          npm run data:validate
      - name: Build and identify this code/data pair
        env:
          GITHUB_PAGES: "true"
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          args=()
          if [[ -n "$ALLOW_REPLAY" ]]; then args+=("$ALLOW_REPLAY"); fi
          node scripts/publish_news.mjs --snapshot "$RUNNER_TEMP/news-latest" --check-dist dist "${args[@]}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published code and all three data hashes
        env:
          NEWS_DATA_SHA: ${{ steps.restore.outputs.news_data_sha }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$ALLOW_REPLAY" ]]; then args+=("$ALLOW_REPLAY"); fi
          # Code deployment needs no contents:write permission.
          node scripts/publish_news.mjs --snapshot "$RUNNER_TEMP/news-latest" --verify-url "$PAGE_URL" --no-record "${args[@]}"
