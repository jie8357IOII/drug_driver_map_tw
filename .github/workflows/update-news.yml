name: Update LTN news

on:
  schedule:
    # 00:17 Asia/Taipei. Avoid the busy start of the hour.
    - cron: "17 16 * * *"
  workflow_dispatch:
    inputs:
      start_date:
        description: "Optional first day (YYYY-MM-DD); supply both dates for backfill"
        type: string
      end_date:
        description: "Optional last day (YYYY-MM-DD), inclusive"
        type: string

permissions:
  contents: read

concurrency:
  group: ltn-news-data-pr
  cancel-in-progress: false
  queue: max

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Run the shared news PR workflow
        env:
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          NEWS_RUN_DIR: ${{ runner.temp }}/ltn-news
        shell: bash
        run: |
          args=()
          if [ -n "$START_DATE" ] || [ -n "$END_DATE" ]; then
            args+=(--start "$START_DATE" --end "$END_DATE")
          fi
          npm run news:pr -- "${args[@]}"
      - name: Retain source decisions, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ltn-news/news-report.*
          if-no-files-found: ignore
          retention-days: 30
